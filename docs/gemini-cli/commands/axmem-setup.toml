description = "Configure Axmem MCP server for Gemini CLI"
prompt = """
# Axmem Setup

Configure the Axmem semantic memory MCP server for Gemini CLI.

## Step 1: Check Existing Configuration

First, check if Axmem is already configured:

```bash
gemini mcp list | grep -i axmem
```

If already configured:
- Ask user if they want to reconfigure
- If no, exit with message: "Axmem is already configured. Use `gemini mcp list` to see details."
- If yes, remove existing first: `gemini mcp remove axmem`

## Step 2: Choose Setup Type

Ask the user which setup they prefer:

**Question**: "How would you like to configure Axmem?"

**Options**:
1. **Standard (Recommended)** - Runs the installed `axmem` command against a Qdrant on `http://127.0.0.1:6333`, as the one local tenant (`AUTH_MODE=none`). Perfect for most users.
2. **Custom** - For advanced setups: remote HTTP server, another Qdrant, custom embeddings, a bearer token, etc.

Axmem is on PyPI (`0.6.0rc1`, a release candidate), and `uvx axmem` runs it without installing. To have `axmem` on the `PATH`
(`which axmem`), install it with `uv tool install --extra-index-url https://pypi.nvidia.com axmem` (a checkout works too:
`uv tool install .`).

## Step 3a: Standard Setup

If user chose Standard. Axmem refuses to start without `AUTH_MODE`, and a server that Gemini CLI starts runs over STDIO,
which carries no bearer token, so `AUTH_MODE=none` goes into the user config file first (every request is then the
one local tenant):

```bash
mkdir -p ~/.config/axmem && echo "AUTH_MODE=none" >> ~/.config/axmem/.env
gemini mcp add axmem axmem
```

Confirm success:
```bash
gemini mcp list | grep -i axmem
```

Report: "Axmem is now configured! Your memories are stored in the Qdrant at `http://127.0.0.1:6333` (start one first if none runs)."

## Step 3b: Custom Setup

If user chose Custom:

1. Fetch the configuration docs:
```
WebFetch: https://github.com/Axiumine/axmem/blob/main/docs/configuration.md
```

2. Ask what they need:
   - **Remote HTTP server** - Connect to Axmem running elsewhere
   - **Qdrant address** - Use a Qdrant on another host (`QDRANT_URL`, `QDRANT_API_KEY`)
   - **Custom embeddings** - Use different embedding model/provider
   - **Authentication** - A bearer token for a server on a network (`AUTH_MODE=jwt`, `introspection` or `static`, see the configuration docs); there is no OAuth sign-in

3. Based on their answers, guide them through the relevant configuration options from the docs.

4. Build the appropriate command:

**For HTTP remote server** (a server on a network needs the token; one on this machine with `AUTH_MODE=none` needs no header):
```bash
gemini mcp add -t http --header "Authorization: Bearer $AXMEM_TOKEN" axmem https://HOST:PORT/mcp
```

**For stdio with environment variables:**
```bash
# Gemini CLI doesn't support inline env vars in mcp add
# User needs to set environment variables before running gemini:
export AUTH_MODE=none
export QDRANT_URL=http://qdrant.internal:6333
export QDRANT_API_KEY=your-qdrant-api-key
export EMBEDDING_PROVIDER=Google
export EMBEDDING_MODEL=models/gemini-embedding-001
export GOOGLE_AI_API_KEY=your-google-api-key
gemini mcp add axmem axmem
```

5. Test the configuration:
```bash
gemini mcp list | grep -i axmem
```

## Troubleshooting

If setup fails:
- Check that `axmem` is installed: `which axmem` (`uv tool install --extra-index-url https://pypi.nvidia.com axmem`)
- Run `AUTH_MODE=none axmem` by hand: a start that is refused prints one `Error:` line with the cause
- For HTTP: verify the server is running and accessible
- Check Gemini CLI logs for MCP connection errors

## Notes

- Memories live in Qdrant, in the collections `axmem_memories` and `axmem_links` (`QDRANT_COLLECTION_PREFIX`)
- For full configuration reference: https://github.com/Axiumine/axmem/blob/main/docs/configuration.md
"""
