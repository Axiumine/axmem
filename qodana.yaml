#-------------------------------------------------------------------------------#
#            Qodana analysis is configured by qodana.yaml file                  #
#            https://www.jetbrains.com/help/qodana/qodana-yaml.html             #
#                                                                               #
#  Never put QODANA_TOKEN here: it lives in the git-ignored dotenv file or in   #
#  the environment of the machine that pushes (Qodana runs in the pre-push      #
#  hook).                                                                       #
#-------------------------------------------------------------------------------#
version: "1.0"

# Qodana Ultimate Plus (Python): inspections + taint/vulnerable-dependency + licence audit.
linter: jetbrains/qodana-python:2026.2

profile:
  name: qodana.recommended

include:
  - name: VulnerableLibrariesLocal
  - name: CheckDependencyLicenses

# actionlint-py is left out of the environment: its sdist downloads the actionlint binary from GitHub when it is built (the uv
# cache is empty on every run), so a GitHub that is slow or unreachable would fail the gate long into a push. No module imports it,
# trivy still scans it in uv.lock, and the actionlint gate runs from the project's own environment.
bootstrap: export UV_CACHE_DIR=/tmp/uv-cache SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+qodana && pip install uv && uv sync --locked --all-extras --dev --no-install-package actionlint-py

exclude:
  - name: All
    paths:
      - .venv
      - .gitnexus
      - .idea
      - .coverage-data
      - .qodana-results
      - node_modules
      - test_harness/runs
      - docs/assets
      - app/_version.py

  # A vulture whitelist is a list of bare names on purpose.
  - name: PyStatementEffectInspection
    paths:
      - vulture_whitelist.py

  # main.py: PyCharm infers that asyncio.run(_run_reembed(...)) never returns (the coroutine ends in
  # process-exit helpers); the statement after it runs in the tests that stub those helpers.
  - name: PyUnreachableCodeInspection
    paths:
      - main.py

failureConditions:
  severityThresholds:
    critical: 0
    high: 0
