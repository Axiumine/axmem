# Dependabot version updates. This is a setting of the Dependabot service of GitHub, read from the default branch; it is
# not a workflow, adds no trigger to .github/workflows and runs nothing on a runner of ours (tests/architecture/
# test_workflows.py, which forbids a schedule there, does not apply to it). OpenSSF Scorecard reads its presence for the
# check Dependency-Update-Tool. Dependabot opens pull requests; ci.yml, quality.yml and codeql.yml check them like any other.
version: 2

updates:
  # The actions of .github/workflows. Dependabot keeps a 40-hex commit pin and rewrites the version comment on the
  # same line (`# v4.4.0`), the form that test_every_action_of_every_workflow_is_a_commit_not_a_tag_that_can_move checks.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # release.yml refers to this reusable workflow by tag, as its provenance needs, and holds the same version in
      # SLSA_GENERATOR_VERSION and the commit of that tag in SLSA_GENERATOR_COMMIT, which a test and the release guard
      # compare. A bump of the `uses` line alone would break both, so the three are changed by hand, together.
      - dependency-name: "slsa-framework/slsa-github-generator"

  # pyproject.toml (dependencies and the dev and harness groups, all exact `==` pins) and uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The three TensorRT packages come from NVIDIA's index and move together, and their version is part of the engine
      # fingerprint. They are bumped by hand, as docs/gpu-models.md ("TensorRT version pin and bump policy") says: change
      # the three pins, run `uv lock`, then the whole test suite on a GPU host, which hosted CI cannot do.
      - dependency-name: "tensorrt-cu13"
      - dependency-name: "tensorrt-cu13-bindings"
      - dependency-name: "tensorrt-cu13-libs"

  # The base image of the UAT walkthrough harness: `FROM node:24@sha256:...` in test_harness/docker/Dockerfile. Dependabot
  # keeps the digest of the tag current, so the pin follows the image without a hand edit. This is the Dockerfile of a
  # test image only (the project has no container deployment), and a pull request that changes it is checked like any other.
  - package-ecosystem: "docker"
    directory: "/test_harness/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The Dockerfile names the Node line (24) on purpose; another major is chosen by hand, not offered by a bot.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # The agent CLI that the same image installs with `npm ci`: test_harness/docker/package.json (exact version) and
  # package-lock.json, the lock file that the Dockerfile copies in.
  - package-ecosystem: "npm"
    directory: "/test_harness/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
