name: Release

# Signs the files that scripts/release-pypi.sh gives to PyPI, and attests them. It also makes the SBOM of the release (a
# CycloneDX file of the locked runtime dependencies, scripts/release/sbom.py), signs it the same way, attaches it and adds it
# to the subjects of the provenance; it is not a file of PyPI and is in no manifest. It runs on the push of a plain release tag
# (v<version>, the tag the script pushes) and on nothing else: a run started by hand would sign again and replace the
# bundles of the push run with ones that publish.yml refuses. It uploads nothing to any index:
# publish.yml, which the script dispatches on the same tag once the signing here has succeeded, is the only workflow that
# does. A tag without the release-digests.json of the script is refused: the bytes PyPI will serve could not be proven to
# be the bytes signed here. The GitHub release it attaches the files to gets the section of CHANGELOG.md of its version as
# its notes, and a tag whose changelog has no such section, or an empty one, is refused as well. See docs/release.md.

on:
  push:
    tags:
      - "v*.*.*"

env:
  # cosign v3 signs a blob as a Sigstore bundle (`.sigstore.json`): one file carrying signature + Fulcio chain + Rekor
  # inclusion proof, readable by any sigstore-* verifier rather than cosign alone. It also carries the fix for
  # GHSA-fx35-mq7g-6g98 (CVSS 7.4): before v2.6.5 / v3.1.3, `verify-blob` on a *legacy* JSON bundle accepted a bare
  # public key in the `cert` field and bypassed --certificate-identity / --certificate-oidc-issuer while still
  # printing `Verified OK`. The protobuf bundle is not affected, so moving the version and the format is one change.
  # cosign-installer v3.x cannot install cosign v3, hence @v4 at the step.
  COSIGN_VERSION: v3.1.3
  # Declared pin for the generator ref below: a reusable-workflow `uses:` cannot read `env`, so the two are held
  # together by a test (tests/architecture/test_release_workflow.py), not by interpolation.
  SLSA_GENERATOR_VERSION: v2.1.0
  # The commit that tag pointed to when it was chosen. The generator cannot be pinned by commit (see its job), so
  # `publish-ready` of scripts/release-pypi.sh compares this with what the tag points to on GitHub and stops a release
  # whose tag was moved. Set it together with the version, from `git ls-remote <generator repository> refs/tags/<tag>`.
  SLSA_GENERATOR_COMMIT: f7dd8c54c2067bafc12ca7a55595d5ee9b75204a

permissions:
  contents: read

# A release is never cancelled by a newer run: one tag, one signing run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-artefacts:
    name: Sign wheels + sdist (cosign keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    outputs:
      subjects-b64: ${{ steps.subjects.outputs.value }}
    steps:
      # A fully qualified ref: a bare name is resolved branch first, so a branch called like the tag would be built.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false

      - name: Check the checkout is the commit of the tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")" ]] \
            || { echo "::error::HEAD is not the commit of refs/tags/${TAG_NAME}"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] \
              || { echo "::error::HEAD is not the commit that the push of ${TAG_NAME} started"; exit 1; }
          fi

      # No cache: a tag run restores what a run of main wrote, and this job signs. The version is pinned, and its archive
      # checked against the sha256 that GitHub records for uv-x86_64-unknown-linux-gnu.tar.gz of that release: the SBOM is
      # made by `uv export --format cyclonedx1.5`, a preview feature whose output may change from one version to the next,
      # and a signed file must not depend on whatever version is the latest on the day of the tag. Change both together.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false
          version: "0.12.17"
          checksum: "fa82fd8dde8e8eefdecada6aa0889666556cfceb690d06e0c3bca49eb3070a63"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      # The epoch and the version come from the release manifest, NOT from this commit: the artifact that gets
      # published is the one release-pypi.sh built, and reproducing it byte for byte means reusing the clock and the
      # version that build pinned. The tagged commit's timestamp is a different number. The manifest must also name
      # this very tag, so a second tag on a release commit signs nothing; nothing reaches the step outputs unchecked.
      - name: Resolve SOURCE_DATE_EPOCH and the version from the release manifest
        id: manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! -f release-digests.json ]]; then
            echo "::error::release-digests.json is missing on this tag: it was not cut by scripts/release-pypi.sh, so the bytes PyPI will serve cannot be proven equal to the bytes signed here. Re-cut the release through the script."
            exit 1
          fi
          epoch=$(python3 -c 'import json; print(json.load(open("release-digests.json"))["source_date_epoch"])')
          version=$(python3 -c 'import json; print(json.load(open("release-digests.json"))["version"])')
          manifest_tag=$(python3 -c 'import json; print(json.load(open("release-digests.json"))["tag"])')
          part='(0|[1-9][0-9]*)'
          [[ "$epoch" =~ ^[0-9]+$ ]] \
            || { echo "::error::the epoch of release-digests.json is not a number of seconds"; exit 1; }
          [[ "$version" =~ ^${part}\.${part}\.${part}((a|b|rc)${part})?(\.post${part})?(\.dev${part})?$ ]] \
            || { echo "::error::the version of release-digests.json is not a release version"; exit 1; }
          [[ "$manifest_tag" == "$TAG_NAME" && "v${version}" == "$TAG_NAME" ]] \
            || { echo "::error::release-digests.json names another release than the tag ${TAG_NAME}: it was cut for ${manifest_tag}"; exit 1; }
          echo "Reproducing the build of ${version} at SOURCE_DATE_EPOCH=${epoch}"
          echo "epoch=${epoch}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The release carries the log of its own version: the section of CHANGELOG.md that scripts/release-pypi.sh stamped
      # for this tag, as the body of the GitHub release (`body_path` below). Before anything is built or signed, so a
      # changelog with no section of the tag, an empty one or one that GitHub would refuse stops the run here. The file
      # is outside the workspace and dist/. See scripts/release/notes.py.
      - name: Extract the release notes from CHANGELOG.md
        id: notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          python3 -m scripts.release.notes --changelog CHANGELOG.md --tag "$TAG_NAME" --output "$NOTES_FILE"
          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Build wheel + sdist
        env:
          SOURCE_DATE_EPOCH: ${{ steps.manifest.outputs.epoch }}
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.manifest.outputs.version }}
        run: uv build

      # The gate. Everything below signs and attests; none of it is worth anything unless these are the bytes that
      # release-pypi.sh built and that PyPI will serve.
      - name: Verify the rebuild matches the release manifest
        run: |
          set -euo pipefail
          python3 -m scripts.release.digests verify \
            --manifest release-digests.json \
            --dist dist

      # What is signed is Axmem's source and nothing else: no model weights, engines or NVIDIA libraries.
      - name: Check what the package holds
        run: python3 -m scripts.quality dist-check dist

      # The SBOM is what `pip install` of the wheel brings: the dependencies of pyproject.toml and the extras of the wheel, as
      # uv.lock at this tag locks them, with no dependency group (docs/release.md). It is made at the epoch and the version of
      # the manifest, checked against uv.lock and pyproject.toml, and written outside the workspace and dist/ (the manifest, the
      # guard and publish.yml know the wheel and the sdist only). A lock the generator cannot read, or a document that does not
      # have the shape, stops the run here, before anything is signed.
      - name: Generate and check the SBOM
        id: sbom
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          EPOCH: ${{ steps.manifest.outputs.epoch }}
          SBOM_DIR: ${{ runner.temp }}/sbom
        run: |
          set -euo pipefail
          mkdir -p "$SBOM_DIR"
          file="${SBOM_DIR}/axmem-${VERSION}.cdx.json"
          python3 -m scripts.release.sbom generate --version "$VERSION" --epoch "$EPOCH" --output "$file"
          python3 -m scripts.release.sbom verify "$file" --version "$VERSION"
          echo "path=${file}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign artefacts (keyless, Fulcio OIDC, Rekor log)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          artefacts=(dist/*.whl dist/*.tar.gz)
          if [[ ${#artefacts[@]} -eq 0 ]]; then
            echo "::error::no build artefacts found under dist/"
            exit 1
          fi
          # One Sigstore bundle per artefact. cosign v3 ignores --output-signature / --output-certificate, so the old
          # .sig + .crt + .cosign.bundle trio is gone by design, not by omission.
          for f in "${artefacts[@]}"; do
            echo "Signing ${f}"
            cosign sign-blob \
              --yes \
              --bundle "${f}.sigstore.json" \
              "${f}"
          done

      - name: Self-verify signatures (round-trip)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in dist/*.whl dist/*.tar.gz; do
            echo "Verifying ${f}"
            cosign verify-blob \
              --bundle "${f}.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG_NAME}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${f}"
          done

      - name: Sign the SBOM (keyless)
        env:
          COSIGN_YES: "true"
          SBOM: ${{ steps.sbom.outputs.path }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "${SBOM}.sigstore.json" "${SBOM}"

      - name: Verify the SBOM signature (round-trip)
        env:
          TAG_NAME: ${{ github.ref_name }}
          SBOM: ${{ steps.sbom.outputs.path }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle "${SBOM}.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG_NAME}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${SBOM}"

      - name: Attach artefacts + signatures to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sigstore.json
          fail_on_unmatched_files: true

      # After the step above, which creates the release. The SBOM and its bundle are not in that step's list: they are not in dist/.
      # --clobber so that a repeated run replaces the pair, as that action does for the files it attaches.
      - name: Attach the SBOM and its signature to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          SBOM: ${{ steps.sbom.outputs.path }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" "$SBOM" "${SBOM}.sigstore.json" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Compute SLSA provenance subjects (sha256 + name, base64)
        id: subjects
        env:
          SBOM: ${{ steps.sbom.outputs.path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artefacts=(dist/*.whl dist/*.tar.gz)
          if [[ ${#artefacts[@]} -eq 0 ]]; then
            echo "::error::no artefacts to attest"
            exit 1
          fi
          # the SBOM is attested with the files it describes
          artefacts+=("${SBOM}")
          # produce `<sha256>  <basename>` lines, then base64 (single line)
          lines=""
          for f in "${artefacts[@]}"; do
            sum=$(sha256sum "${f}" | awk '{print $1}')
            lines+="${sum}  $(basename "${f}")"$'\n'
          done
          b64=$(printf '%s' "${lines}" | base64 -w0)
          echo "value=${b64}" >> "$GITHUB_OUTPUT"

  provenance-artefacts:
    name: SLSA-3 provenance for wheels + sdist
    needs: sign-artefacts
    permissions:
      id-token: write
      contents: write
      actions: read
    # A tag and not a commit, on purpose: the README of slsa-github-generator says its reusable workflows "MUST be referenced
    # by tag in order for the slsa-verifier to be able to verify the ref", in the form @vX.Y.Z. That is a limit of GitHub
    # Actions and it overrides the advice to pin by digest. The other actions of this file are commits. What the tag may
    # point to is held by SLSA_GENERATOR_COMMIT above, which `publish-ready` checks before every release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.sign-artefacts.outputs.subjects-b64 }}
      provenance-name: axmem-artefacts.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
      # Authorises the repo name into the public Rekor log, which a private repository needs so that the generator does
      # not halt; the keyless cosign signing above already exposes it. Harmless on a public repository.
      private-repository: true
