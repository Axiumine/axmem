name: CI

# Hosted runners only, and only the checks that need neither an NVIDIA GPU nor Docker. The suites that run the real
# TensorRT models and a real Qdrant (tests, end-to-end, cluster, coverage, memory budgets, Qodana, mutation) run on the
# developer machine in the pre-push Git hook: see docs/quality-gates.md.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The TensorRT libraries (about 3.8 GB) are left out of the environment: ruff, import-linter and the architecture
  # tests (which include the tests of these workflow files) never load them.
  lint:
    name: lint (py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --no-install-package tensorrt-cu13-libs

      - name: Check architecture boundaries, rule proofs and workflow rules
        run: uv run --frozen --no-sync pytest tests/architecture/ -v

      - name: Run linting
        run: uv run --frozen --no-sync ruff check .

  smoke-test:
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for hatch-vcs version detection
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build wheel
        run: uv build

      # The wheel names the TensorRT packages without an index, and on PyPI `tensorrt-cu13` and `tensorrt-cu13-libs` are
      # placeholders that fetch the 3.8 GB of libraries when installed. The dependencies come from uv.lock instead, as in every other job
      # (NVIDIA's index for the TensorRT packages), without the libraries: `axmem --help` never loads them.
      - name: Install the locked dependencies
        run: uv sync --locked --no-dev --no-install-project --no-install-package tensorrt-cu13-libs

      # The wheel and the sdist are Axmem's source and nothing else: the model weights, the engines and the NVIDIA
      # libraries have licenses of their own and are fetched by the user. The gate builds both from the checkout and
      # reads what they hold; it needs only the standard library, which the environment above provides.
      - name: Check what the package holds
        run: uv run --frozen --no-sync python -m scripts.quality gate package

      - name: Test installation and CLI works
        run: |
          WHEEL=$(ls "$PWD"/dist/*.whl)
          echo "Testing installation from wheel: $WHEEL"
          uv pip install --no-deps "$WHEEL"

          # Run away from the checkout, so that the installed wheel is what gets imported, not app/ and main.py
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.venv/bin/axmem" --help
          echo "✓ CLI command works"

          echo "✓ Smoke test passed - the wheel installs and starts on top of the locked dependencies"

      # What a user does with the wheel: pip and `uv tool install` resolve its own metadata, where the TensorRT packages have
      # no index. With the extra index that the README documents, all three resolve to NVIDIA's files and the libraries to
      # the real wheel, not to the PyPI placeholder. Resolving downloads no wheel.
      - name: Resolve the wheel with the documented index
        run: |
          printf '%s\n' "$PWD"/dist/*.whl > "$RUNNER_TEMP/wheel-requirement.txt"
          uv pip compile --python-version 3.14 --format pylock.toml --extra-index-url https://pypi.nvidia.com \
            "$RUNNER_TEMP/wheel-requirement.txt" > "$RUNNER_TEMP/wheel-resolution.toml"
          python3 - "$RUNNER_TEMP/wheel-resolution.toml" <<'PYTHON'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as handle:
              packages = {package["name"]: package for package in tomllib.load(handle)["packages"]}
          for name in ("tensorrt-cu13", "tensorrt-cu13-bindings", "tensorrt-cu13-libs"):
              files = [package_file["url"] for package_file in packages[name].get("wheels", [])]
              files += [packages[name]["sdist"]["url"]] if "sdist" in packages[name] else []
              assert files and all(url.startswith(f"https://pypi.nvidia.com/{name}/") for url in files), (name, files)
          assert packages["tensorrt-cu13-libs"].get("wheels"), "the libraries must resolve to a wheel, not to the placeholder"
          print("✓ The wheel resolves with the documented index: the three TensorRT packages come from NVIDIA's index")
          PYTHON
