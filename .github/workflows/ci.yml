name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks need no GPU and run on hosted runners. The TensorRT libraries (about 3.8 GB) are
  # left out of the environment: ruff, import-linter and the architecture tests never load them.
  lint:
    name: lint (py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --no-install-package tensorrt-cu13-libs

      - name: Check architecture boundaries and rule proofs
        run: uv run --frozen --no-sync pytest tests/architecture/ -v

      - name: Run linting
        run: uv tool run ruff check .

  # The integration and end-to-end suites run the real TensorRT embedder and reranker: they need a self-hosted runner
  # with an NVIDIA GPU (driver R580 or newer). See docs/quality-gates.md for the runner requirements.
  # The job runs the code of the pull request (conftest.py, tests, pyproject.toml) on a host with a Docker daemon, so a
  # pull request from a fork never reaches it: the head repository must be this one. Keep the condition on every job
  # that uses the self-hosted runner, and never trigger these workflows with pull_request_target.
  test:
    name: test (py${{ matrix.python }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    runs-on: [self-hosted, linux, gpu]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v

      - name: Run Qdrant E2E tests
        run: uv run pytest tests/e2e/ -v

  smoke-test:
    runs-on: ubuntu-latest
    needs: [lint, test]
    # `test` is skipped for a pull request from a fork; the wheel check on the hosted runner still runs for it.
    if: ${{ !cancelled() && needs.lint.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.test.result) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for hatch-vcs version detection
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build wheel
        run: uv build

      # The wheel names the TensorRT packages without an index, and the PyPI projects of those names are placeholders that
      # fetch the 3.8 GB of libraries when installed. The dependencies come from uv.lock instead, as in every other job
      # (NVIDIA's index for the TensorRT packages), without the libraries: `axmem --help` never loads them.
      - name: Install the locked dependencies
        run: uv sync --locked --no-dev --no-install-project --no-install-package tensorrt-cu13-libs

      - name: Test installation and CLI works
        run: |
          WHEEL=$(ls "$PWD"/dist/*.whl)
          echo "Testing installation from wheel: $WHEEL"
          uv pip install --no-deps "$WHEEL"

          # Run away from the checkout, so that the installed wheel is what gets imported, not app/ and main.py
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.venv/bin/axmem" --help
          echo "✓ CLI command works"

          echo "✓ Smoke test passed - the wheel installs and starts on top of the locked dependencies"
