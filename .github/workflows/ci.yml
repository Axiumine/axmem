name: CI

# Hosted runners only, and only the checks that need neither an NVIDIA GPU nor Docker. The suites that run the real
# TensorRT models and a real Qdrant (tests, end-to-end, cluster, coverage, memory budgets, Qodana, mutation) run on the
# developer machine in the pre-push Git hook: see docs/quality-gates.md.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The TensorRT libraries (about 3.8 GB) are left out of the environment: ruff, import-linter and the architecture
  # tests (which include the tests of these workflow files) never load them.
  lint:
    name: lint (py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --no-install-package tensorrt-cu13-libs

      - name: Check architecture boundaries, rule proofs and workflow rules
        run: uv run --frozen --no-sync python -m scripts.quality gate architecture

      - name: Run linting
        run: uv run --frozen --no-sync python -m scripts.quality gate ruff

  # The package and wheel gates build into temporary directories of their own and install the wheel in an environment of
  # their own: this job only installs the project tooling (twine, check-wheel-contents) and calls them by name.
  smoke-test:
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --no-install-package tensorrt-cu13-libs

      # The wheel and the sdist are Axmem's source and nothing else: the model weights, the engines and the NVIDIA
      # libraries have licenses of their own and are fetched by the user. The gate builds both from the checkout and
      # reads what they hold.
      - name: Check what the package holds
        run: uv run --frozen --no-sync python -m scripts.quality gate package

      # What a user does with the wheel: it installs on the locked dependencies (the wheel names the TensorRT packages
      # without an index, and on PyPI they are placeholders that fetch 3.8 GB), starts, and resolves with the extra
      # index that the README documents. See scripts/quality/wheel.py.
      - name: Check that the wheel installs, starts and resolves
        run: uv run --frozen --no-sync python -m scripts.quality gate wheel
