name: Quality gates

# The static gates of the local Git hooks (.githooks/, scripts/quality) on hosted runners, under the same gate names: the
# ones that need neither an NVIDIA GPU nor Docker. Everything else (tests, the Qdrant cluster suite, coverage, memory
# budgets, Qodana, mutation) runs on the developer machine in the pre-push hook: see docs/quality-gates.md.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"  # `uv run` must not install the TensorRT libraries the sync step left out
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # The static gates never load TensorRT: leave its 3.8 GB libraries out of the environment.
      - run: uv sync --locked --all-extras --dev --no-install-package tensorrt-cu13-libs
      - name: ruff
        run: uv run --frozen python -m scripts.quality gate ruff
      - name: import boundaries
        run: uv run --frozen python -m scripts.quality gate imports
      - name: bandit
        run: uv run --frozen python -m scripts.quality gate bandit
      - name: semgrep
        run: uv run --frozen python -m scripts.quality gate semgrep
      - name: shellcheck
        run: uv run --frozen python -m scripts.quality gate shellcheck
      - name: actionlint
        run: uv run --frozen python -m scripts.quality gate actionlint
      - name: vulture
        run: uv run --frozen python -m scripts.quality gate vulture
      - name: radon complexity (min rating B)
        run: uv run --frozen python -m scripts.quality gate radon-cc
      - name: radon maintainability (grade A)
        run: uv run --frozen python -m scripts.quality gate radon-mi
      - name: mypy
        run: uv run --frozen python -m scripts.quality gate mypy
      - name: pylint (>= 8/10)
        run: uv run --frozen python -m scripts.quality gate pylint

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    env:
      # Keep in step with TRIVY_VERSION in scripts/quality/security.py (a test compares them); the hash is the one in
      # trivy_<version>_checksums.txt of the release.
      TRIVY_VERSION: "0.75.0"
      TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # The gate runs the binary that TRIVY_BIN names. Without one it would run trivy's Docker image, and this job uses no Docker.
      - name: Install trivy
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy" trivy
          echo "TRIVY_BIN=$RUNNER_TEMP/trivy/trivy" >> "$GITHUB_ENV"
      - run: python -m scripts.quality gate trivy
