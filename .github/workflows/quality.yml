name: Quality gates

# Mirrors the local Git hooks (.githooks/, scripts/quality): the same gate names run here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "17 3 * * 1"  # weekly mutation run
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group: the weekly mutation run (up to six hours, on the default branch) must neither be
# cancelled by a push to that branch nor cancel the push run that is in progress when it starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# GPU runner: a self-hosted runner labelled [self-hosted, linux, gpu] with an NVIDIA GPU (driver R580 or newer).
# Every job that runs tests/integration, tests/e2e or tests/cluster needs it, because the suites run the real
# TensorRT embedder and reranker, and a Docker daemon, because they start the real Qdrant nodes. See docs/quality-gates.md for the runner requirements.
# These jobs run the code of the commit they check next to the host's Docker daemon: every one of them has the condition
# below (a pull request from a fork never reaches it), or runs only on schedule and manual dispatch. Never trigger this
# workflow with pull_request_target.

jobs:
  static:
    name: static (${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"  # `uv run` must not install the TensorRT libraries the sync step left out
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The static gates never load TensorRT: leave its 3.8 GB libraries out of the environment.
      - run: uv sync --locked --all-extras --dev --no-install-package tensorrt-cu13-libs
      - name: ruff
        run: uv run --frozen python -m scripts.quality gate ruff
      - name: import boundaries
        run: uv run --frozen python -m scripts.quality gate imports
      - name: bandit
        run: uv run --frozen python -m scripts.quality gate bandit
      - name: semgrep
        env:
          SEMGREP_PACKS: p/python p/security-audit
        run: uv run --frozen python -m scripts.quality gate semgrep
      - name: vulture
        run: uv run --frozen python -m scripts.quality gate vulture
      - name: radon complexity (min rating B)
        run: uv run --frozen python -m scripts.quality gate radon-cc
      - name: radon maintainability (grade A)
        run: uv run --frozen python -m scripts.quality gate radon-mi
      - name: mypy
        run: uv run --frozen python -m scripts.quality gate mypy
      - name: pylint (>= 8/10)
        run: uv run --frozen python -m scripts.quality gate pylint

  snapshots:
    name: snapshots
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-extras --dev
      - run: uv run --frozen python -m scripts.quality gate snapshots

  coverage:
    name: 100% coverage (Qdrant node + cluster e2e)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-extras --dev
      - run: uv run --frozen python -m scripts.quality gate tests
      - run: uv run --frozen python -m scripts.quality gate e2e-qdrant
      - run: uv run --frozen python -m scripts.quality gate coverage

  memory:
    name: memray budgets
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-extras --dev
      - run: uv run --frozen python -m scripts.quality gate memray

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m scripts.quality gate trivy

  qodana:
    name: qodana
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

  mutation:
    name: mutation (weekly)
    # Schedule and manual dispatch run on the repository itself, never for a pull request.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-extras --dev
      # Informational ratchet: mutmut needs a scope (a full run is ~33k mutants). Lower the tolerance
      # as surviving mutants get killed, then drop continue-on-error.
      - run: uv run --frozen python -m scripts.quality gate mutation
        continue-on-error: true
        env:
          MUTATION: "1"
          MUTATION_TARGETS: "app.utils.* app.config.*"
          MUTATION_MAX_SURVIVORS: "50"
