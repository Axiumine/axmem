name: Quality gates

# Mirrors the local Git hooks (.githooks/, scripts/quality): the same gate names run here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "17 3 * * 1"  # weekly mutation run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed

jobs:
  static:
    name: static (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --dev
      - name: ruff
        run: uv run --frozen python -m scripts.quality gate ruff
      - name: import boundaries
        run: uv run --frozen python -m scripts.quality gate imports
      - name: bandit
        run: uv run --frozen python -m scripts.quality gate bandit
      - name: semgrep
        env:
          SEMGREP_PACKS: p/python p/security-audit
        run: uv run --frozen python -m scripts.quality gate semgrep
      - name: vulture
        run: uv run --frozen python -m scripts.quality gate vulture
      - name: radon complexity (min rating B)
        run: uv run --frozen python -m scripts.quality gate radon-cc
      - name: radon maintainability (grade A)
        run: uv run --frozen python -m scripts.quality gate radon-mi
      - name: mypy
        run: uv run --frozen python -m scripts.quality gate mypy
      - name: pylint (>= 8/10)
        run: uv run --frozen python -m scripts.quality gate pylint
      - name: snapshots
        run: uv run --frozen python -m scripts.quality gate snapshots

  coverage:
    name: 100% coverage (SQLite + PostgreSQL e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-extras --dev
      - name: Install PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_DIR }}
          key: fastembed-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            fastembed-${{ runner.os }}-
      - run: uv run --frozen python -m scripts.quality gate tests
      - run: uv run --frozen python -m scripts.quality gate e2e-postgres
      - run: uv run --frozen python -m scripts.quality gate coverage

  memory:
    name: memray budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-extras --dev
      - run: uv run --frozen python -m scripts.quality gate memray

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m scripts.quality gate trivy

  qodana:
    name: qodana
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

  mutation:
    name: mutation (weekly)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-extras --dev
      # Informational ratchet: mutmut needs a scope (a full run is ~33k mutants). Lower the tolerance
      # as surviving mutants get killed, then drop continue-on-error.
      - run: uv run --frozen python -m scripts.quality gate mutation
        continue-on-error: true
        env:
          MUTATION: "1"
          MUTATION_TARGETS: "app.utils.* app.config.*"
          MUTATION_MAX_SURVIVORS: "50"
