name: E2E Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (py${{ matrix.python }})
    # The suite runs the real TensorRT embedder and reranker: self-hosted runner with an NVIDIA GPU (see docs/quality-gates.md)
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Install PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          pg_dump --version
          psql --version

      - name: Run E2E tests
        run: uv run --frozen pytest tests/e2e/ -v -m e2e
