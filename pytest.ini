[pytest]
pythonpath = .
testpaths = tests
markers =
    cluster: end-to-end tests against a three-node Qdrant cluster in Docker (run by the e2e-qdrant gate, never by default)
    asyncio: mark test as async
    snapshot: syrupy snapshot of a public surface (tool metadata, routes, CLI help, schema)
    memory: memray memory-budget test (run with --memray; Linux/macOS only)
    limit_memory: pytest-memray allocation budget for one test (inert without --memray)
addopts = -m "not cluster"
asyncio_mode = auto
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
# Every warning is an error, so that a deprecated call, an unawaited coroutine or a leaked resource fails the test
# that causes it. Pytest applies a later line before an earlier one, so an ignore added below must sit after "error"
# and be limited to one message, one category and one module of a library that we do not control. There is none:
# google-genai 1.66.0 needed one for typing._UnionGenericAlias, and 2.34.0 no longer imports it on Python 3.14.
filterwarnings =
    error
