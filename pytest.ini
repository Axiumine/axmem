[pytest]
pythonpath = .
testpaths = tests
markers =
    cluster: end-to-end tests against a three-node Qdrant cluster in Docker (run by the e2e-qdrant gate, never by default)
    asyncio: mark test as async
    snapshot: syrupy snapshot of a public surface (tool metadata, routes, CLI help, schema)
    memory: memray memory-budget test (run with --memray; Linux/macOS only)
    limit_memory: pytest-memray allocation budget for one test (inert without --memray)
addopts = -m "not cluster"
asyncio_mode = auto
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
# Every warning is an error, so that a deprecated call, an unawaited coroutine or a leaked resource fails the test
# that causes it. Pytest applies a later line before an earlier one, so each ignore below sits after "error" and
# is limited to one message, one category and one module of a library that we do not control.
filterwarnings =
    error
    # google-genai 1.66.0 (pinned in pyproject.toml) imports typing._UnionGenericAlias at import time in
    # google/genai/types.py, which Python 3.14 reports as deprecated (removal in 3.17). The code is in the library and
    # the import is the provider adapter's (app/repositories/embeddings/embedding_adapter.py); only a newer release
    # of the library can drop it, and moving the pinned SDK of a provider is not a change for a warning filter.
    ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3\.17:DeprecationWarning:google\.genai\.types
