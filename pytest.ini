[pytest]
pythonpath = .
testpaths = tests
markers =
    cluster: end-to-end tests against a three-node Qdrant cluster in Docker (run by the e2e-qdrant gate, never by default)
    asyncio: mark test as async
    snapshot: syrupy snapshot of a public surface (tool metadata, routes, CLI help, schema)
    memory: memray memory-budget test (run with --memray; Linux/macOS only)
    limit_memory: pytest-memray allocation budget for one test (inert without --memray)
addopts = -m "not cluster"
asyncio_mode = auto
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
