[project]
name = "axmem"
dynamic = ["version"]
description = "MCP Server for AI Agent Memory - persistent, semantically-searchable memory for AI agents"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only AND MIT"
license-files = ["LICENSE", "LICENSE-FORGETFUL-MIT.md"]
authors = [{name = "Giovanni Manzoni", email = "dev@giovannimanzoni.com"}]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dotenv==0.9.9",
    "fastmcp==3.4.10",
    "cuda-python==13.4.4",
    "google-genai==1.66.0",
    "httpx==0.28.1",
    "huggingface-hub==1.4.1",
    "numpy==2.4.2",
    "ollama==0.6.1",
    "openai==2.20.0",
    "platformdirs==4.7.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "starlette==1.3.1",
    "tensorrt-cu13==11.4.0.106",
    "tensorrt-cu13-bindings==11.4.0.106",
    "tensorrt-cu13-libs==11.4.0.106",
    "tiktoken==0.12.0",
    "tokenizers==0.22.2",
    "uvicorn==0.40.0",
    "qdrant-client==1.19.1",
]

# TensorRT 11 for CUDA 13 comes from NVIDIA's index (the PyPI project of the same name only
# holds an installer stub). The index is explicit: only the packages named below use it.
# [tool.uv.sources] is not part of a built wheel: an install of the wheel (pip, `uv tool install`) passes
# `--extra-index-url https://pypi.nvidia.com` instead; the README (Installing the package) lists the commands,
# and tests/integration/test_install_requirements.py keeps them in step with this file.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
tensorrt-cu13 = { index = "nvidia" }
tensorrt-cu13-bindings = { index = "nvidia" }
tensorrt-cu13-libs = { index = "nvidia" }

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    # Fuzzing (fuzz/, docs/fuzzing.md). The one build of CPython 3.14 that Atheris publishes is for Linux x86_64 and
    # there is no source distribution, so the marker keeps `uv sync` from failing anywhere else.
    "atheris==3.1.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "bandit[toml]==1.9.4",
    "check-wheel-contents==0.6.3",
    "coverage[toml]==7.16.2",
    # The TLS tests (tests/tls_support.py) make their own certificate authority and server certificates with it; the JWT
    # verifiers of FastMCP install it already.
    "cryptography==50.0.0",
    "grimp==3.17",
    # starlette.testclient (tests/integration/test_auth_info.py) warns that httpx is deprecated for it and asks for httpx2;
    # pytest.ini turns warnings into errors.
    "httpx2==2.16.0",
    "import-linter==2.15",
    # The tests that sign tokens (tests/jwt_support.py) import it; FastMCP verifies with it and installs it.
    "joserfc==1.7.0",
    "memray==1.20.0 ; sys_platform != 'win32'",
    "mutmut==3.8.0",
    "mypy==2.4.0",
    "pylint==4.1.3",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-memray==1.11.0 ; sys_platform != 'win32'",
    "pyyaml==6.0.3",
    "radon==6.0.1",
    "requests==2.33.0",
    # The reuse gate (docs/quality-gates.md, "Licensing headers"). The extra installs the library that the gate names to detect
    # the encoding of a file, so that the result does not depend on whether the machine has libmagic.
    "reuse[charset-normalizer]==6.2.0",
    "ruff==0.17.1",
    "shellcheck-py==0.11.0.1",
    "syrupy==6.1.1",
    "twine==7.0.0",
    "vulture==2.16",
]
# Dev-only: drives the UAT walkthrough container; agent-shell-py lives in the
# container image (test_harness/docker/Dockerfile), not on the host.
harness = ["docker==7.2.0"]

[project.urls]
Homepage = "https://github.com/Axiumine/axmem"
Repository = "https://github.com/Axiumine/axmem"
Issues = "https://github.com/Axiumine/axmem/issues"

[project.scripts]
axmem = "main:cli"

[build-system]
# Exact versions: the build of the release commit here and the rebuild of release.yml must produce the same bytes.
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "app/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["app", "main.py"]

[tool.hatch.build.targets.sdist]
include = ["/app", "/main.py", "/README.md", "/LICENSE", "/LICENSE-FORGETFUL-MIT.md"]

[tool.importlinter]
root_package = "app"
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "foundation"
name = "Models, contracts and shared support stay independent"
type = "forbidden"
source_modules = [
    "app.models", "app.protocols", "app.utils",
    "app.config.settings", "app.config.logging_config",
    "app.middleware.logging_middleware", "app.exceptions", "app.version",
]
forbidden_modules = [
    "app.services", "app.repositories", "app.routes", "app.bootstrap",
    "app.middleware.auth", "app.middleware.static_token", "app.middleware.token_verifiers",
    "app.middleware.loopback_guard", "app.config.auth",
]

[[tool.importlinter.contracts]]
id = "services"
name = "Services use contracts instead of integrations or entry points"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "app.repositories", "app.routes", "app.bootstrap",
    "app.middleware.auth", "app.middleware.static_token", "app.middleware.token_verifiers",
    "app.middleware.loopback_guard", "app.config.auth",
]

[[tool.importlinter.contracts]]
id = "repositories"
name = "Repositories stay independent of workflows and entry points"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = [
    "app.services", "app.routes", "app.bootstrap",
    "app.middleware.auth", "app.middleware.static_token", "app.middleware.token_verifiers",
    "app.middleware.loopback_guard", "app.config.auth",
]

[[tool.importlinter.contracts]]
id = "external"
name = "Core code stays independent of Qdrant, provider and backup integrations"
type = "forbidden"
source_modules = [
    "app.models", "app.protocols", "app.services", "app.utils",
    "app.config.settings", "app.config.logging_config",
    "app.middleware.logging_middleware", "app.exceptions", "app.version",
]
forbidden_modules = [
    "qdrant_client", "openai", "google", "httpx", "ollama",
    "tensorrt", "cuda", "tokenizers", "huggingface_hub",
    "subprocess", "shutil",
]

# Every Qdrant request is built in client.py, schema.py and store.py: store.py is the one place that adds the
# tenant condition to a filter, so nothing else may hold a Qdrant client or build a request of its own.
[[tool.importlinter.contracts]]
id = "qdrant"
name = "Only the Qdrant client, schema and store import qdrant_client"
type = "forbidden"
source_modules = [
    "app.repositories.qdrant.archive", "app.repositories.qdrant.backup", "app.repositories.qdrant.inspector",
    "app.repositories.qdrant.memory_base", "app.repositories.qdrant.memory_links",
    "app.repositories.qdrant.memory_reads", "app.repositories.qdrant.memory_reembedding",
    "app.repositories.qdrant.memory_repository", "app.repositories.qdrant.memory_search",
    "app.repositories.qdrant.memory_writes", "app.repositories.qdrant.payloads",
    "app.repositories.embeddings", "app.routes", "app.middleware", "app.config", "app.bootstrap",
]
forbidden_modules = ["qdrant_client"]
# These three are the allowed importers; cutting their own imports leaves every other path to the library visible.
ignore_imports = [
    "app.repositories.qdrant.client -> qdrant_client",
    "app.repositories.qdrant.schema -> qdrant_client",
    "app.repositories.qdrant.store -> qdrant_client",
]

[[tool.importlinter.contracts]]
id = "routes"
name = "HTTP and MCP handlers use services instead of repositories or bootstrap"
type = "forbidden"
source_modules = [
    "app.routes.api", "app.routes.mcp", "app.routes.server_state", "app.middleware.auth",
]
forbidden_modules = ["app.repositories", "app.bootstrap"]

# Keep CLI startup exceptions separate so HTTP/MCP cannot use them to reach bootstrap.
[[tool.importlinter.contracts]]
id = "cli"
name = "CLI uses services with explicit startup wiring"
type = "forbidden"
source_modules = ["app.routes.cli"]
forbidden_modules = ["app.repositories", "app.bootstrap"]
ignore_imports = [
    "app.routes.cli.local_executor -> app.bootstrap",
    "app.routes.cli.operator_commands -> app.bootstrap",
]

# ---------------------------------------------------------------------------
# Quality gates. Orchestrated by scripts/quality (python -m scripts.quality) (see docs/quality-gates.md);
# Git hooks live in .githooks/ and are installed with `uv run python -m scripts.quality install`.
# ---------------------------------------------------------------------------

[tool.coverage.run]
# fuzz/ is outside the report on purpose: a harness is run by tests/integration/test_fuzz_targets.py for a few
# hundred inputs, which proves it works, not that every line of it ran.
source = ["app", "main"]
branch = true
relative_files = true
parallel = true
# Keeps the data file and the per-process fragments that parallel mode writes out of the repository root.
data_file = ".coverage-data/.coverage"
concurrency = ["thread"]
patch = ["subprocess"]
omit = ["*/_version.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@(typing\\.)?overload",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "if __name__ == .__main__.:",
]

[tool.coverage.paths]
source = ["app", "*/app"]

[tool.mypy]
python_version = "3.14"
files = ["app", "main.py", "scripts", "fuzz"]
# strict = true turns on every optional check that mypy documents as strict: check_untyped_defs, the disallow_untyped_*,
# disallow_incomplete_defs, disallow_any_generics, disallow_subclassing_any, disallow_untyped_decorators,
# no_implicit_optional, warn_redundant_casts, warn_unused_ignores, warn_return_any, no_implicit_reexport, strict_equality,
# strict_concatenate and extra_checks. It reported 165 errors in 33 files once (annotations only, all fixed); an
# unannotated def, a bare generic, a re-export through another module or a stale type: ignore is an error now.
strict = true
# Not part of strict, kept on: code that mypy proves unreachable is an error.
warn_unreachable = true
# Also part of strict; named so that a reader of this table sees that a stale type: ignore fails the gate.
warn_unused_ignores = true
# Not part of strict: a type that becomes Any because its package ships no type information is an error. The two
# places that name such a type (the TensorRT logger base class and the tokenizer) say so in a type: ignore.
disallow_any_unimported = true
# Error codes that mypy leaves off and that the code base already satisfies. Measured and left off, with their count:
# redundant-expr (3: defensive checks on a value the types call always true), truthy-bool (2: the same kind),
# explicit-override (18: asks for @override on every override).
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "unused-awaitable",
    "redundant-self",
    "mutable-override",
    "deprecated",
    "exhaustive-match",
    "narrowed-type-not-subtype",
    "unimported-reveal",
]
show_error_codes = true
pretty = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["tiktoken.*", "dotenv.*", "tensorrt.*", "tensorrt_bindings.*", "cuda.*", "tokenizers.*", "atheris.*"]
ignore_missing_imports = true

[tool.pylint.main]
jobs = 0
py-version = "3.14"
# The score is 8.00: 1785 of its findings are line-too-long at 100 columns (the rest cost 0.15 points), and the threshold
# is the score rounded down to 0.5. scripts/quality/static.py passes the same value on the command line; raise both together.
fail-under = 8.0
# Extensions that the code base satisfies completely, so each one costs nothing and keeps the pattern out. Measured and left
# out, with their findings (counted with one process, jobs = 0 reports each message twice): consider_using_assignment_expr
# 134 (style), while_used 15, bad_builtin 9, set_membership 7 (a set needs hashable operands), no_self_use 3,
# consider_ternary_expression 2, empty_comment 2 (blank separators of a comment block), confusing_elif 1.
load-plugins = [
    "pylint.extensions.mccabe",
    "pylint.extensions.check_elif",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.consider_refactoring_into_while_condition",
    "pylint.extensions.dict_init_mutate",
    "pylint.extensions.dunder",
    "pylint.extensions.eq_without_hash",
    "pylint.extensions.for_any_all",
    "pylint.extensions.private_import",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.redefined_loop_name",
    "pylint.extensions.typing",
]
ignore-paths = ["^app/_version\\.py$"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-locals = 25
max-statements = 80
max-branches = 20
max-returns = 10
max-attributes = 12

[tool.pylint.typecheck]
# The native modules fill their members when they are imported, which pylint cannot see: with them installed it
# reports every attribute as missing (E1101), without them (the hosted runner) it reports nothing, and mypy skips them
# for the same reason (`ignore_missing_imports` above). The check stays on for every other module.
ignored-modules = ["tensorrt", "cuda.*"]

[tool.pylint."messages control"]
# Style/noise categories only; correctness checks (E, most W, R) stay enabled.
disable = [
    "missing-module-docstring",    # docstring policy is not enforced in this repo (ruff D is off)
    "missing-class-docstring",
    "missing-function-docstring",
    "duplicate-code",              # the repository mixins repeat small query shapes on purpose
    "too-few-public-methods",      # protocol/adapter/data classes
    "logging-fstring-interpolation",  # project-wide logging style
    "import-outside-toplevel",     # deliberate lazy imports (startup cost, optional providers)
]

[tool.bandit]
exclude_dirs = ["tests", "test_harness/runs", ".venv", ".gitnexus", "node_modules"]

[tool.vulture]
paths = ["app", "main.py", "test_harness", "scripts", "fuzz", "vulture_whitelist.py"]
min_confidence = 60
exclude = ["app/_version.py", "test_harness/runs/"]
# Decorators that register the decorated function with a framework: pydantic validators,
# FastMCP routes/tools are called by the framework only.
ignore_decorators = [
    "@field_validator",
    "@model_validator",
    "@mcp.custom_route",
    "@rest_route",  # app.routes.api.access: registers the handler behind the credential, scope and body checks
    "@mcp.tool",
    "@_register",  # app.config.auth: registers the provider factory under its AUTH_MODE name
]
# Names a framework reads by reflection.
ignore_names = [
    "model_config",  # pydantic / pydantic-settings class configuration
    "_missing_",  # enum.Enum hook, called by Enum lookup of unknown values
    "prepare",  # logging.handlers.QueueHandler hook, called by QueueHandler.emit
]

[tool.mutmut]
# Full-project mutation (~33k mutants) is impractical; scripts/quality scopes every run.
# The sandbox (mutants/) must contain everything the selected tests read from the repo root.
source_paths = ["app/"]
pytest_add_cli_args_test_selection = ["tests/architecture/", "tests/integration/"]
do_not_mutate = ["app/_version.py"]
# CUDA cannot start in a fork of a process that has started it, and the suites start it (the GPU preflight of the collection,
# the TensorRT engines). The fork server only imports pytest and forks the workers; the default fork would fork them from the
# process that ran the baseline, and warming the server up with a collection would start CUDA in it as well.
process_isolation = "forkserver"
forkserver_warmup = "none"
also_copy = [
    "pytest.ini", "main.py", "pyproject.toml", "ruff.toml",
    ".env.example",  # test_reference_docs parses it
    "trivy.yaml", ".gitignore",  # test_workflows checks that the trivy gate skips mutants/, which git ignores
    "release-digests.json",  # the release commit adds it; test_release_workflow names it (mutmut skips a path that does not exist yet)
    ".githooks/",  # the hook tests (test_commit_msg_hook, test_denylist_check_hook) run the scripts of the repository
    ".github/",  # test_workflows reads the CI workflows
    "test_harness/", "scripts/", "skills/", "docs/", "architecture.md", "README.md",
    "CHANGELOG.md",  # test_install_requirements and test_reference_docs read it
]
# Modules that start Python child processes in other directories cannot run inside the mutmut
# sandbox (an instrumented app module needs mutmut's config at import time), so they are skipped.
# A worker ends with os._exit, so pytest's clean-up at exit never runs and a run of thousands of mutants keeps the temp
# directories of every test (the Qdrant backups alone are 210 MB each): "failed" removes those of the tests that pass
# (and the whole base directory of a passing session) at once; tests/conftest.py removes the rest when a session ends.
pytest_add_cli_args = [
    "-p", "no:cacheprovider", "-q", "-o", "tmp_path_retention_policy=failed",
    "--ignore=tests/architecture/test_contracts.py",
    "--ignore=tests/architecture/test_licensing_headers.py",  # reads the notice of every source file of the checkout, which the sandbox mutates
    "--ignore=tests/integration/test_cli_env_file_writer.py",
    "--ignore=tests/integration/test_cli_server_origin.py",  # starts the CLI in a subprocess for every case (38 runs), too slow to repeat for each mutant
    "--ignore=tests/integration/test_config_precedence.py",
    "--ignore=tests/integration/test_fuzz_targets.py",  # starts the harnesses of fuzz/ (atheris takes over the child process)
    "--ignore=tests/integration/test_gpu_preflight.py",
    "--ignore=tests/integration/test_harness_config_cli.py",
    "--ignore=tests/integration/test_harness_container_image_and_mounts.py",
    "--ignore=tests/integration/test_harness_fixture_and_report.py",
    "--ignore=tests/integration/test_harness_lifecycle.py",
    "--ignore=tests/integration/test_harness_throwaway_server.py",
    "--ignore=tests/integration/test_harness_walkthrough.py",
    "--ignore=tests/integration/test_main_lifespan_and_routes.py",
    "--ignore=tests/integration/test_quality_reuse_gate.py",  # the real tool on scratch repositories and on the checkout
    "--ignore=tests/integration/test_quality_runner.py",
    "--ignore=tests/integration/test_quality_shell_gates.py",  # real tools on scratch repositories and on the checkout
    "--ignore=tests/integration/test_quality_wheel_gate.py",  # builds the real package of the checkout
    # The release scripts tests run the scripts of a copy of scripts/ in scratch repositories and read git metadata
    # that the sandbox does not hold; they do not test app/, which is what mutmut mutates.
    "--ignore-glob=tests/integration/test_release_*.py",
    "--ignore=tests/integration/test_startup_config_wiring.py",
    "--ignore=tests/integration/test_tensorrt_startup_refusal.py",
    # These tests start main.py in a scratch directory, where an instrumented app module cannot find mutmut's config.
    "--deselect=tests/integration/test_startup_failures.py::test_a_settings_file_that_is_not_utf8_is_named_in_one_line",
    "--deselect=tests/integration/test_tls_settings.py::test_the_child_process_ends_with_one_error_line_and_exit_code_1",
]
