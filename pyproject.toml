[project]
name = "axmem"
dynamic = ["version"]
description = "MCP Server for AI Agent Memory - persistent, semantically-searchable memory for AI agents"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [{name = "Scott", email = "scott@example.com"}]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dotenv==0.9.9",
    "fastmcp==3.2.2",
    "cuda-python==13.4.4",
    "google-genai==1.66.0",
    "httpx==0.28.1",
    "huggingface-hub==1.4.1",
    "numpy==2.4.2",
    "ollama==0.6.1",
    "openai==2.20.0",
    "platformdirs==4.7.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "starlette==1.3.1",
    "tensorrt-cu13==11.4.0.106",
    "tensorrt-cu13-bindings==11.4.0.106",
    "tensorrt-cu13-libs==11.4.0.106",
    "tiktoken==0.12.0",
    "tokenizers==0.22.2",
    "uvicorn==0.40.0",
    "qdrant-client==1.19.1",
]

[project.optional-dependencies]
ollama = ["ollama>=0.4"]

# TensorRT 11 for CUDA 13 comes from NVIDIA's index (the PyPI project of the same name only
# holds an installer stub). The index is explicit: only the packages named below use it.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
tensorrt-cu13 = { index = "nvidia" }
tensorrt-cu13-bindings = { index = "nvidia" }
tensorrt-cu13-libs = { index = "nvidia" }

[dependency-groups]
dev = [
    "bandit[toml]==1.9.4",
    "coverage[toml]==7.16.2",
    "grimp==3.17",
    "import-linter==2.15",
    "memray>=1.20.0 ; sys_platform != 'win32'",
    "mutmut==3.8.0",
    "mypy==2.4.0",
    "pylint==4.1.3",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-memray>=1.11.0 ; sys_platform != 'win32'",
    "pyyaml==6.0.3",
    "radon==6.0.1",
    "requests==2.33.0",
    "ruff==0.17.1",
    "syrupy==6.1.1",
    "vulture==2.16",
]
# Dev-only: drives the UAT walkthrough container; agent-shell-py lives in the
# container image (test_harness/docker/Dockerfile), not on the host.
harness = ["docker>=7.1.0"]

[project.urls]
Homepage = "https://github.com/Axiumine/axmem"
Repository = "https://github.com/Axiumine/axmem"
Issues = "https://github.com/Axiumine/axmem/issues"

[project.scripts]
axmem = "main:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "app/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["app", "main.py"]

[tool.hatch.build.targets.sdist]
include = ["app", "main.py", "README.md", "LICENSE"]

[tool.importlinter]
root_package = "app"
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "foundation"
name = "Models, contracts and shared support stay independent"
type = "forbidden"
source_modules = [
    "app.models", "app.protocols", "app.utils",
    "app.config.settings", "app.config.logging_config",
    "app.middleware.logging_middleware", "app.exceptions", "app.version",
]
forbidden_modules = [
    "app.services", "app.repositories", "app.routes", "app.bootstrap",
    "app.middleware.auth", "app.middleware.static_token", "app.middleware.token_verifiers",
    "app.middleware.loopback_guard", "app.config.auth",
]

[[tool.importlinter.contracts]]
id = "services"
name = "Services use contracts instead of integrations or entry points"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "app.repositories", "app.routes", "app.bootstrap",
    "app.middleware.auth", "app.middleware.static_token", "app.middleware.token_verifiers",
    "app.middleware.loopback_guard", "app.config.auth",
]

[[tool.importlinter.contracts]]
id = "repositories"
name = "Repositories stay independent of workflows and entry points"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = [
    "app.services", "app.routes", "app.bootstrap",
    "app.middleware.auth", "app.middleware.static_token", "app.middleware.token_verifiers",
    "app.middleware.loopback_guard", "app.config.auth",
]

[[tool.importlinter.contracts]]
id = "external"
name = "Core code stays independent of Qdrant, provider and backup integrations"
type = "forbidden"
source_modules = [
    "app.models", "app.protocols", "app.services", "app.utils",
    "app.config.settings", "app.config.logging_config",
    "app.middleware.logging_middleware", "app.exceptions", "app.version",
]
forbidden_modules = [
    "qdrant_client", "openai", "google", "httpx", "ollama",
    "tensorrt", "cuda", "tokenizers", "huggingface_hub",
    "subprocess", "shutil",
]

# Every Qdrant request is built in client.py, schema.py and store.py: store.py is the one place that adds the
# tenant condition to a filter, so nothing else may hold a Qdrant client or build a request of its own.
[[tool.importlinter.contracts]]
id = "qdrant"
name = "Only the Qdrant client, schema and store import qdrant_client"
type = "forbidden"
source_modules = [
    "app.repositories.qdrant.archive", "app.repositories.qdrant.backup", "app.repositories.qdrant.inspector",
    "app.repositories.qdrant.memory_base", "app.repositories.qdrant.memory_links",
    "app.repositories.qdrant.memory_reads", "app.repositories.qdrant.memory_reembedding",
    "app.repositories.qdrant.memory_repository", "app.repositories.qdrant.memory_search",
    "app.repositories.qdrant.memory_writes", "app.repositories.qdrant.payloads",
    "app.repositories.embeddings", "app.routes", "app.middleware", "app.config", "app.bootstrap",
]
forbidden_modules = ["qdrant_client"]
# These three are the allowed importers; cutting their own imports leaves every other path to the library visible.
ignore_imports = [
    "app.repositories.qdrant.client -> qdrant_client",
    "app.repositories.qdrant.schema -> qdrant_client",
    "app.repositories.qdrant.store -> qdrant_client",
]

[[tool.importlinter.contracts]]
id = "routes"
name = "HTTP and MCP handlers use services instead of repositories or bootstrap"
type = "forbidden"
source_modules = [
    "app.routes.api", "app.routes.mcp", "app.routes.server_state", "app.middleware.auth",
]
forbidden_modules = ["app.repositories", "app.bootstrap"]

# Keep CLI startup exceptions separate so HTTP/MCP cannot use them to reach bootstrap.
[[tool.importlinter.contracts]]
id = "cli"
name = "CLI uses services with explicit startup wiring"
type = "forbidden"
source_modules = ["app.routes.cli"]
forbidden_modules = ["app.repositories", "app.bootstrap"]
ignore_imports = [
    "app.routes.cli.local_executor -> app.bootstrap",
    "app.routes.cli.operator_commands -> app.bootstrap",
]

# ---------------------------------------------------------------------------
# Quality gates. Orchestrated by scripts/quality (python -m scripts.quality) (see docs/quality-gates.md);
# Git hooks live in .githooks/ and are installed with `uv run python -m scripts.quality install`.
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["app", "main"]
branch = true
relative_files = true
parallel = true
# Keeps the data file and the per-process fragments that parallel mode writes out of the repository root.
data_file = ".coverage-data/.coverage"
concurrency = ["thread"]
patch = ["subprocess"]
omit = ["*/_version.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@(typing\\.)?overload",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "if __name__ == .__main__.:",
]

[tool.coverage.paths]
source = ["app", "*/app"]

[tool.mypy]
python_version = "3.14"
files = ["app", "main.py", "scripts"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["tiktoken.*", "dotenv.*", "tensorrt.*", "tensorrt_bindings.*", "cuda.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pylint.main]
jobs = 0
py-version = "3.14"
fail-under = 8.0
load-plugins = ["pylint.extensions.mccabe"]
ignore-paths = ["^app/_version\\.py$"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-locals = 25
max-statements = 80
max-branches = 20
max-returns = 10
max-attributes = 12

[tool.pylint."messages control"]
# Style/noise categories only; correctness checks (E, most W, R) stay enabled.
disable = [
    "missing-module-docstring",    # docstring policy is not enforced in this repo (ruff D is off)
    "missing-class-docstring",
    "missing-function-docstring",
    "duplicate-code",              # the repository mixins repeat small query shapes on purpose
    "too-few-public-methods",      # protocol/adapter/data classes
    "logging-fstring-interpolation",  # project-wide logging style
    "import-outside-toplevel",     # deliberate lazy imports (startup cost, optional providers)
]

[tool.bandit]
exclude_dirs = ["tests", "test_harness/runs", ".venv", ".gitnexus", "node_modules"]

[tool.vulture]
paths = ["app", "main.py", "test_harness", "scripts", "vulture_whitelist.py"]
min_confidence = 60
exclude = ["app/_version.py", "test_harness/runs/"]
# Decorators that register the decorated function with a framework: pydantic validators,
# FastMCP routes/tools are called by the framework only.
ignore_decorators = [
    "@field_validator",
    "@model_validator",
    "@mcp.custom_route",
    "@rest_route",  # app.routes.api.access: registers the handler behind the credential, scope and body checks
    "@mcp.tool",
    "@_register",  # app.config.auth: registers the provider factory under its AUTH_MODE name
]
# Names a framework reads by reflection.
ignore_names = [
    "model_config",  # pydantic / pydantic-settings class configuration
    "_missing_",  # enum.Enum hook, called by Enum lookup of unknown values
    "prepare",  # logging.handlers.QueueHandler hook, called by QueueHandler.emit
]

[tool.mutmut]
# Full-project mutation (~33k mutants) is impractical; scripts/quality scopes every run.
# The sandbox (mutants/) must contain everything the selected tests read from the repo root.
source_paths = ["app/"]
pytest_add_cli_args_test_selection = ["tests/architecture/", "tests/integration/"]
do_not_mutate = ["app/_version.py"]
also_copy = [
    "pytest.ini", "main.py", "pyproject.toml", "ruff.toml",
    ".githooks/",  # the hook tests (test_commit_msg_hook, test_denylist_check_hook) run the scripts of the repository
    ".github/",  # test_workflows reads the CI workflows
    "test_harness/", "scripts/", "skills/", "docs/", "architecture.md", "README.md",
]
# Modules that start Python child processes in other directories cannot run inside the mutmut
# sandbox (an instrumented app module needs mutmut's config at import time), so they are skipped.
pytest_add_cli_args = [
    "-p", "no:cacheprovider", "-q",
    "--ignore=tests/architecture/test_contracts.py",
    "--ignore=tests/integration/test_cli_env_file_writer.py",
    "--ignore=tests/integration/test_config_precedence.py",
    "--ignore=tests/integration/test_gpu_preflight.py",
    "--ignore=tests/integration/test_harness_config_cli.py",
    "--ignore=tests/integration/test_harness_container_image_and_mounts.py",
    "--ignore=tests/integration/test_harness_fixture_and_report.py",
    "--ignore=tests/integration/test_harness_lifecycle.py",
    "--ignore=tests/integration/test_harness_throwaway_server.py",
    "--ignore=tests/integration/test_harness_walkthrough.py",
    "--ignore=tests/integration/test_main_lifespan_and_routes.py",
    "--ignore=tests/integration/test_quality_runner.py",
    "--ignore=tests/integration/test_startup_config_wiring.py",
    "--ignore=tests/integration/test_tensorrt_startup_refusal.py",
]
