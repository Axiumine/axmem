version = 1
SPDX-PackageName = "Axmem"
SPDX-PackageDownloadLocation = "https://github.com/Axiumine/axmem"

# Every file that cannot carry a comment (documents, data, configuration, images) or is generated is covered here. A source
# file (Python, shell, workflow, Dockerfile) carries its notice in the file instead and is not listed: one without a
# notice fails the reuse gate. See "Licensing headers" in docs/quality-gates.md.
#
# Both annotations override what a file says about itself: the License section of README.md or the quotation of a header in a
# document is text, not a notice. Where two annotations match one file, the last one wins.

# Written for Axmem: no commit by an author of Forgetful touches these files. The globs name types of files, never a
# directory, so that a new source file without a notice is not covered by accident.
[[annotations]]
precedence = "override"
path = [
    "**/*.md",
    "**/*.json",
    "**/*.toml",
    "**/*.lock",
    "**/*.png",
    "**/*.nix",
    "**/*.yaml",
    "**/*.cfg",
    "**/*.ini",
    "**/*.example",
    ".github/CODEOWNERS",
    ".semgrep/axmem.yml",
    ".semgrepignore",
    ".shellcheckrc",
    ".trivyignore",
]
SPDX-FileCopyrightText = "2026 Giovanni Manzoni"
SPDX-License-Identifier = "AGPL-3.0-only"

# Derived from Forgetful: a commit by one of its authors (Scott Raisbeck, Olivier Berthet, Tristin Stagg) is in the history
# of each of these files. Listed by path, and last, so that it wins over the globs above. The MIT notice of Forgetful is in
